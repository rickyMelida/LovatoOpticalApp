name: Build & Push to Docker Hub

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  IMAGE_NAME: lovato-optical/lovatoOpticalApp
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore "LovatoOpticalApp/LovatoOpticalApp.csproj"

      # 4. Build del proyecto MVC
      - name: Build
        run: dotnet build "LovatoOpticalApp/LovatoOpticalApp.csproj" --no-restore -c Release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact
          path: LovatoOpticalApp/obj/Release

      # 5. Tests
      #- name: Test
      #  run: dotnet test "LovatoOpticalApp.Tests/LovatoOpticalApp.Tests.csproj" -c Release --verbosity normal
      #  env:
          # Variables solo para los tests
      #    ConnectionStrings__Default: ${{ secrets.TEST_DB_CONNECTION }}
  deploy-to-docker:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: build-artifact
      - name: Output Content
        run: ls

      - name: Checkout
        uses: actions/checkout@v4
      # 6. Login a Docker Hub
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: LovatoOpticalApp/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/lovato-optical-app:latest