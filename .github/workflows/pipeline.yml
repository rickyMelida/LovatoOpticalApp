name: Build & Push to Docker Hub

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  IMAGE_NAME: lovato-optical/lovatoOpticalApp
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. Restaurar dependencias del proyecto MVC
      - name: Restore dependencies
        run: dotnet restore "LovatoOpticalApp/LovatoOpticalApp.csproj"

      # 4. Build del proyecto MVC
      - name: Build
        run: dotnet build "LovatoOpticalApp/LovatoOpticalApp.csproj" --no-restore -c Release

      # 5. Tests
      #- name: Test
      #  run: dotnet test "LovatoOpticalApp/LovatoOpticalApp.csproj" --no-build -c Release --verbosity normal
      #  env:
          # Variables solo para los tests
      #    ConnectionStrings__Default: ${{ secrets.TEST_DB_CONNECTION }}

      # 6. Login a Docker Hub
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: LovatoOpticalApp
          file: LovatoOpticalApp/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/lovato-optical-app:latest